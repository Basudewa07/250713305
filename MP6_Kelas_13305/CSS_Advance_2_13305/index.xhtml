<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>

<body>
    <h1>Formulir Pendaftaran Seminar</h1>
    <h2>Data Peserta</h2>

    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" style="border-collapse:collapse; width:100%;">
         
            <tr>
                <td style="width:32%;">
                    <label for="nama"><strong>Nama Lengkap</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" size="30" />
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <label for="nim"><strong>NIM</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30" />
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <label for="email"><strong>Email</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="email" name="email" size="30" />
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-Laki" /><label for="laki">Laki-Laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" /><label for="perempuan">Perempuan</label>
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <label for="prodi"><strong>Program Studi</strong>
                    </label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
             </table>
    </form>

    <h2>Pilihan Seminar</h2>

    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" style="border-collapse:collapse; width:100%;">

           <tr>
                <td style="width:32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="reguler" name="tiket" value="Reguler" /><label for="reguler">Reguler</label>
                    <input type="radio" id="exe" name="tiket" value="Executive" /><label for="exe">Executive</label>
                    <input type="radio" id="vip" name="tiket" value="VIP" /><label for="vip">VIP</label>
                </td>
            </tr>

            <tr>
                <td style="width:32%; vertical-align: middle;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="topik1" name="topik" value="AI Masa Kini" /><label for="topik1">AI Masa Kini</label>
                    </p>
                    <p>
                        <input type="checkbox" id="topik2" name="topik" value="Tantangan Nyata Keamanan Data di Era Digital" /><label for="topik2">Tantangan Nyata Keamanan Data di Era Digital</label>
                    </p>
                    <p>
                        <input type="checkbox" id="topik3" name="topik" value="AI Vs Human" /><label for="topik3">AI Vs Human</label>
                    </p>
                    
                </td>
            </tr>
        </table>
    </form>

    <h2>Informasi Tambahan</h2>

    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" style="border-collapse:collapse; width:100%;">

           <tr>
                <td style="width:32%; vertical-align: middle;">
                    <label for="alasan"><strong>Hal Apa yang Anda Harapkan Setelah Mengikuti Seminar</strong>
                    </label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan" rows="10" cols="23"></textarea>
                </td>
            </tr>
            
            <tr>
                <td style="width:32%;">
                    <label for="bukti"><strong>Lampirkan Bukti Pembayaran</strong>
                    </label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" size="18" accept="image/gif, image/jpeg, image/png" />
                </td>
            </tr>
            
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="simpan" value="Simpan" />
                </td>
            </tr>

        </table>
    </form>
</body>
</html>
