<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Registrasi Data Mahasiswa</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <h1>Formulir Registrasi Data Mahasiswa</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse ; width: 100%;">
            
            <tr>
                <td>
                    <label for="namamhs"><strong>Nama Mahasiswa</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="namamhs" name="namamhs" size="30" />
                </td>
            </tr>

            <tr>
                <td>
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-laki" /><label for="laki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" /><label for="perempuan">Perempuan</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="prodi"><strong>Program Studi</strong>
                    </label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Komputer</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="email"><strong>Alamat Email</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="email" name="email" size="30" />
                </td>
            </tr>

            <tr>
                <td>
                    <label for="telepon"><strong>Nomor Telepon</strong>
                    </label>
                </td>
                <td>
                    <input type="text" name="telepon" id="telepon" size="30"/>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password"><strong>Password</strong>
                    </label>
                </td>
                <td>
                    <input type="password" id="password" name="password" size="30" />
                </td>
            </tr>

            <tr>
                <td>
                    <label for="photo"><strong>Photo Tanda Pengenal</strong>
                    </label>
                </td>
                <td>
                    <input type="file" id="photo" name="photo" size="18" accept="image/gif, image/jpeg, image/png" />
                </td>
            </tr>

            <tr>
                <td>
                    <label for="namasmu"><strong>Nama Sekolah Asal</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="namasmu" nama="namasmu" size="30" />
                </td> 
            </tr>

            <tr>
                <td style="vertical-align: top;"><strong>Peminatan</strong>
                </td>
                <td>

                    <p>
                        <strong>IPA</strong><br />

                        <input type="checkbox" id="ipa1" name="ipa" value="Teknik" />
                        <label for="ipa1">Teknik</label>
                        <input type="checkbox" id="ipa2" name="ipa" value="Kesehatan" />
                        <label for="ipa2">Kesehatan</label>
                        <input type="checkbox" id="ipa3" name="ipa" value="Informatika" />
                        <label for="ipa3">Informatika</label>
                    </p>
                    <p>
                        <strong>IPS</strong><br />
                        <input type="checkbox" id="ips1" name="ips" value="Sejarah" />
                        <label for="ips1">Sejarah</label>
                        <input type="checkbox" id="ips2" name="ips" value="Sosial Humaniora" />
                        <label for="ips2">Sosial Humaniora</label>
                        <input type="checkbox" id="ips3" name="ips" value="Ekonomi Bisnis" />
                        <label for="ips3">Ekonomi Bisnis</label>
                    </p>
                    <p>
                        <strong>Lainnya</strong><br />
                        <input type="checkbox" id="lain" name="lain" value="Tidak Masuk Ke Peminatan Apapun Dalam Pilihan" />
                        <label for="lain">Tidak Masuk Ke Peminatan Apapun Dalam Pilihan</label>
                    </p>
                </td>
            </tr>

            <tr>
                <td style="vertical-align: top;">
                    <label for="ceritaSingkat">
                        <strong>Cerita Singkat Tentangmu</strong>
                    </label>
                </td>
                <td>
                    <textarea id="ceritaSingkat" name="ceritaSingkat" rows="10" cols="23"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" name="Kirim" value="Kirim" />
                </td>
            </tr>
        </table>
    </form>
</body>    
</html>
